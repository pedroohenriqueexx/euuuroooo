(function () {

  function buildCheckoutUrl() {
    var current = new URLSearchParams(window.location.search);
    var finalUrl = new URL(CHECKOUT_BASE);

    current.forEach(function (value, key) {
      finalUrl.searchParams.set(key, value);
    });

    try {
      var utms = JSON.parse(localStorage.getItem('ml_utms') || '{}');
      Object.keys(utms).forEach(function (key) {
        if (!finalUrl.searchParams.has(key)) {
          finalUrl.searchParams.set(key, utms[key]);
        }
      });
    } catch (e) {}

    try {
      if (window.posthog && typeof window.posthog.get_distinct_id === 'function') {
        finalUrl.searchParams.set('ph_distinct_id', window.posthog.get_distinct_id());

    return finalUrl.toString();
  }

  function handleCheckoutClick(anchor) {
    anchor.addEventListener('click', function (e) {
      var href = anchor.getAttribute('href') || '';
      if (href.indexOf('checkout.cooud.com/01KMNTFA2EEM45M56BDDB1GYBV') === -1) return;

      e.preventDefault();

        if (window.MLA && typeof window.MLA.trackInitiateCheckout === 'function') {

      var nextUrl = buildCheckoutUrl();
      setTimeout(function () {
        window.location.href = nextUrl;
      }, 180);
    });
  }

  function bindCheckoutButtons() {
    var anchors = document.querySelectorAll('a[href*="checkout.cooud.com/01KMNTFA2EEM45M56BDDB1GYBV"]');
